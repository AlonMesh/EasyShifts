# version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE:  easyshifsdb
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      -  easyshifs-network
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME:  easyshifsdb
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      -  easyshifs-network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      -  easyshifs-network

volumes:
  db_data:

networks:
   easyshifs-network:
    driver: bridge
